{{- /* BGM 播放器 + 彩蛋动效 */ -}}
{{- $musicDir := "/Thomas/music/" -}}

<!-- BGM 音频元素 -->
<audio id="bgm-default" loop preload="auto">
    <source src="{{ $musicDir }}xiangyang.mp3" type="audio/mpeg">
</audio>
<audio id="bgm-easter" preload="auto">
    <source src="{{ $musicDir }}tiankong.mp3" type="audio/mpeg">
</audio>

<!-- BGM 控制按钮 -->
<div id="bgm-control" class="bgm-control" title="播放/暂停 BGM">
    <svg id="bgm-icon-play" class="bgm-icon" viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M8 5v14l11-7z"/>
    </svg>
    <svg id="bgm-icon-pause" class="bgm-icon" viewBox="0 0 24 24" width="20" height="20" style="display:none">
        <path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
    </svg>
</div>

<!-- 彩蛋 Canvas -->
<canvas id="easter-canvas" class="easter-canvas"></canvas>

<!-- 彩蛋文字覆盖层 -->
<div id="easter-text" class="easter-text"></div>

<style>
/* BGM 控制按钮 */
.bgm-control {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    z-index: 999;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    background: rgba(128, 128, 128, 0.2);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s ease;
    color: var(--global-font-color, #333);
}
.bgm-control:hover {
    background: rgba(128, 128, 128, 0.35);
    transform: scale(1.1);
}
.bgm-control.playing {
    animation: bgm-pulse 2s ease-in-out infinite;
}
@keyframes bgm-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(100, 149, 237, 0.4); }
    50% { box-shadow: 0 0 0 8px rgba(100, 149, 237, 0); }
}
.bgm-icon {
    pointer-events: none;
}

/* 彩蛋 Canvas */
.easter-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 998;
    pointer-events: none;
    display: none;
}
.easter-canvas.active {
    display: block;
}

/* 彩蛋文字 */
.easter-text {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1000;
    pointer-events: none;
    display: none;
    text-align: center;
}
.easter-text.active {
    display: block;
    animation: easter-text-fade 5s ease-out forwards;
}
.easter-text .egg-line {
    font-size: 2.5rem;
    font-weight: bold;
    background: linear-gradient(90deg, #667eea, #764ba2, #f093fb, #667eea);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: easter-gradient 3s linear infinite;
    text-shadow: 0 0 30px rgba(118, 75, 162, 0.5);
    margin: 0.5rem 0;
    letter-spacing: 0.1em;
}
.easter-text .egg-sub {
    font-size: 1.2rem;
    color: rgba(255, 255, 255, 0.8);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    margin-top: 1rem;
}
@keyframes easter-gradient {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
}
@keyframes easter-text-fade {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
}

/* 副标题点击提示 */
.home-subtitle .typeit {
    cursor: pointer;
    transition: text-shadow 0.3s ease;
}
.home-subtitle .typeit:hover {
    text-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
}

/* 彩蛋触发时副标题发光 */
.easter-active .home-subtitle .typeit {
    animation: subtitle-glow 2s ease-in-out infinite;
}
@keyframes subtitle-glow {
    0%, 100% { text-shadow: 0 0 10px rgba(102, 126, 234, 0.5); }
    50% { text-shadow: 0 0 30px rgba(240, 147, 251, 0.8); }
}

/* 全屏遮罩渐变 */
.easter-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 997;
    pointer-events: none;
    display: none;
    background: radial-gradient(ellipse at center, transparent 0%, transparent 30%, rgba(0,0,0,0.3) 100%);
    animation: overlay-fade 5s ease-out forwards;
}
.easter-overlay.active {
    display: block;
}
@keyframes overlay-fade {
    0% { opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; }
}
</style>

<script>
(function() {
    'use strict';

    var bgmDefault = document.getElementById('bgm-default');
    var bgmEaster = document.getElementById('bgm-easter');
    var bgmControl = document.getElementById('bgm-control');
    var iconPlay = document.getElementById('bgm-icon-play');
    var iconPause = document.getElementById('bgm-icon-pause');
    var canvas = document.getElementById('easter-canvas');
    var easterText = document.getElementById('easter-text');
    var overlay = null;
    var isPlaying = false;
    var isEaster = false;
    var easterTriggered = false;

    // BGM 播放/暂停控制
    function playBgm() {
        bgmDefault.play().then(function() {
            isPlaying = true;
            bgmControl.classList.add('playing');
            iconPlay.style.display = 'none';
            iconPause.style.display = 'block';
        }).catch(function(e) {
            console.log('BGM 自动播放被阻止，等待用户交互');
        });
    }

    function pauseBgm() {
        bgmDefault.pause();
        bgmEaster.pause();
        isPlaying = false;
        bgmControl.classList.remove('playing');
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
    }

    bgmControl.addEventListener('click', function() {
        if (isEaster) return;
        if (isPlaying) {
            pauseBgm();
        } else {
            playBgm();
        }
    });

    // 浏览器自动播放策略：首次交互后尝试播放
    function tryAutoPlay() {
        if (!isPlaying && !isEaster) {
            playBgm();
        }
        document.removeEventListener('click', tryAutoPlay);
        document.removeEventListener('keydown', tryAutoPlay);
        document.removeEventListener('touchstart', tryAutoPlay);
    }
    document.addEventListener('click', tryAutoPlay);
    document.addEventListener('keydown', tryAutoPlay);
    document.addEventListener('touchstart', tryAutoPlay);

    // 淡入淡出控制
    function fadeIn(audio, duration, callback) {
        audio.volume = 0;
        audio.play().then(function() {
            var step = 0.02;
            var interval = duration / (1 / step);
            var timer = setInterval(function() {
                if (audio.volume < 1 - step) {
                    audio.volume += step;
                } else {
                    audio.volume = 1;
                    clearInterval(timer);
                    if (callback) callback();
                }
            }, interval);
        }).catch(function(e) { if (callback) callback(); });
    }

    function fadeOut(audio, duration, callback) {
        var step = 0.02;
        var interval = duration / (1 / step);
        var timer = setInterval(function() {
            if (audio.volume > step) {
                audio.volume -= step;
            } else {
                audio.volume = 0;
                audio.pause();
                clearInterval(timer);
                if (callback) callback();
            }
        }, interval);
    }

    // ========== 彩蛋：烟花粒子系统 ==========
    var ctx = canvas.getContext('2d');
    var particles = [];
    var stars = [];
    var meteors = [];
    var animId = null;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // 粒子类
    function Particle(x, y, color, angle, speed) {
        this.x = x;
        this.y = y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.color = color;
        this.life = 1;
        this.decay = 0.008 + Math.random() * 0.012;
        this.size = 2 + Math.random() * 2;
        this.gravity = 0.04;
    }
    Particle.prototype.update = function() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.gravity;
        this.vx *= 0.99;
        this.life -= this.decay;
    };
    Particle.prototype.draw = function() {
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    };

    // 星星类
    function Star() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.5 + 0.5;
        this.opacity = Math.random();
        this.twinkleSpeed = 0.01 + Math.random() * 0.02;
        this.twinkleDir = 1;
    }
    Star.prototype.update = function() {
        this.opacity += this.twinkleSpeed * this.twinkleDir;
        if (this.opacity > 1) { this.opacity = 1; this.twinkleDir = -1; }
        if (this.opacity < 0.2) { this.opacity = 0.2; this.twinkleDir = 1; }
    };
    Star.prototype.draw = function() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#fff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    };

    // 流星类
    function Meteor() {
        this.x = Math.random() * canvas.width;
        this.y = -20;
        this.length = 80 + Math.random() * 120;
        this.speed = 8 + Math.random() * 8;
        this.angle = Math.PI / 4 + (Math.random() - 0.5) * 0.3;
        this.opacity = 0.6 + Math.random() * 0.4;
    }
    Meteor.prototype.update = function() {
        this.x += Math.cos(this.angle) * this.speed;
        this.y += Math.sin(this.angle) * this.speed;
        if (this.y > canvas.height + 50 || this.x > canvas.width + 50) {
            this.x = Math.random() * canvas.width * 0.7;
            this.y = -20;
        }
    };
    Meteor.prototype.draw = function() {
        var tailX = this.x - Math.cos(this.angle) * this.length;
        var tailY = this.y - Math.sin(this.angle) * this.length;
        var gradient = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
        gradient.addColorStop(0, 'rgba(255,255,255,' + this.opacity + ')');
        gradient.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.save();
        ctx.strokeStyle = gradient;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
        ctx.restore();
    };

    // 创建烟花
    function createFirework(x, y) {
        var colors = [
            '#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1',
            '#ff9ff3', '#5f27cd', '#00d2d3', '#ff9f43',
            '#ee5253', '#341f97', '#f368e0', '#ff6348'
        ];
        var color = colors[Math.floor(Math.random() * colors.length)];
        var count = 60 + Math.floor(Math.random() * 40);
        for (var i = 0; i < count; i++) {
            var angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.1;
            var speed = 2 + Math.random() * 5;
            particles.push(new Particle(x, y, color, angle, speed));
        }
    }

    // 初始化星星
    function initStars() {
        stars = [];
        for (var i = 0; i < 120; i++) {
            stars.push(new Star());
        }
    }

    // 初始化流星
    function initMeteors() {
        meteors = [];
        for (var i = 0; i < 6; i++) {
            var m = new Meteor();
            m.y = Math.random() * canvas.height * 0.5;
            meteors.push(m);
        }
    }

    // 动画循环
    var fireworkTimer = 0;
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 绘制星星
        for (var i = 0; i < stars.length; i++) {
            stars[i].update();
            stars[i].draw();
        }

        // 绘制流星
        for (var j = 0; j < meteors.length; j++) {
            meteors[j].update();
            meteors[j].draw();
        }

        // 定时发射烟花
        fireworkTimer++;
        if (fireworkTimer > 25) {
            fireworkTimer = 0;
            var fx = canvas.width * (0.2 + Math.random() * 0.6);
            var fy = canvas.height * (0.15 + Math.random() * 0.4);
            createFirework(fx, fy);
        }

        // 绘制粒子
        for (var k = particles.length - 1; k >= 0; k--) {
            particles[k].update();
            particles[k].draw();
            if (particles[k].life <= 0) {
                particles.splice(k, 1);
            }
        }

        animId = requestAnimationFrame(animate);
    }

    // 触发彩蛋
    function triggerEaster() {
        if (easterTriggered) return;
        easterTriggered = true;
        isEaster = true;
        document.body.classList.add('easter-active');

        // 创建遮罩
        overlay = document.createElement('div');
        overlay.className = 'easter-overlay';
        document.body.appendChild(overlay);
        setTimeout(function() { overlay.classList.add('active'); }, 10);

        // 启动 canvas 动画
        canvas.classList.add('active');
        initStars();
        initMeteors();
        particles = [];
        animate();

        // 显示彩蛋文字
        easterText.innerHTML =
            '<div class="egg-line">天空没有极限</div>' +
            '<div class="egg-sub">我的未来 由我主宰</div>';
        easterText.classList.add('active');

        // BGM 切换：淡出默认 → 淡入彩蛋
        fadeOut(bgmDefault, 800, function() {
            bgmEaster.currentTime = 0;
            fadeIn(bgmEaster, 1000);
        });

        // 彩蛋 BGM 播完后回到默认
        bgmEaster.onended = function() {
            isEaster = false;
            easterTriggered = false;
            document.body.classList.remove('easter-active');

            // 停止动画
            if (animId) cancelAnimationFrame(animId);
            canvas.classList.remove('active');

            // 移除遮罩
            if (overlay) {
                overlay.classList.remove('active');
                setTimeout(function() {
                    if (overlay && overlay.parentNode) {
                        overlay.parentNode.removeChild(overlay);
                    }
                    overlay = null;
                }, 1000);
            }

            // 移除文字
            easterText.classList.remove('active');

            // 淡入默认 BGM
            fadeIn(bgmDefault, 1000);
        };
    }

    // 绑定副标题点击（typeit 动画完成后文本在 .typeit div 中）
    function bindSubtitleClick() {
        var typeitDiv = document.querySelector('.home-subtitle .typeit');
        if (typeitDiv) {
            typeitDiv.addEventListener('click', triggerEaster);
            typeitDiv.title = '点击试试';
        } else {
            // typeit 尚未渲染，稍后重试
            setTimeout(bindSubtitleClick, 500);
        }
    }

    // 等待页面加载完成
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(bindSubtitleClick, 1000);
        });
    } else {
        setTimeout(bindSubtitleClick, 1000);
    }

})();
</script>
